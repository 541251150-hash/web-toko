<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencatat Stok Toko Ibu</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 960px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      font-size: 1.75rem;
      color: #0f172a;
    }

    header p {
      color: #64748b;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.3fr 2fr 1.3fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    @media (max-width: 820px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
    }

    input {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      background: #ffffff;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      height: 42px;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .table-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-secondary {
      background: #0284c7;
      color: white;
      font-size: 0.85rem;
    }

    .btn-secondary:hover {
      background: #0369a1;
    }

    .btn-outline-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      font-size: 0.85rem;
    }

    .btn-outline-danger:hover {
      background: #fef2f2;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: #f8fafc;
    }

    .text-center {
      text-align: center;
    }

    .btn-delete {
      background: #fee2e2;
      color: var(--danger);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .btn-delete:hover {
      background: #fca5a5;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      background: #e2e8f0;
      border-radius: 12px;
      font-size: 0.8rem;
      color: #334155;
    }

    .date-badge {
      font-size: 0.85rem;
      color: #475569;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Pencatat Barang Toko</h1>
      <p>Input daftar barang harian dengan cepat dan simpan otomatis</p>
    </header>

    <!-- FORM INPUT -->
    <div class="card">
      <form id="itemForm" class="form-grid">
        <div class="form-group">
          <label for="tanggal">Tanggal</label>
          <input type="date" id="tanggal" required>
        </div>
        <div class="form-group">
          <label for="namaBarang">Nama Barang</label>
          <input type="text" id="namaBarang" placeholder="Contoh: Minyak Goreng, Shampo" required>
        </div>
        <div class="form-group">
          <label for="keterangan">Keterangan / Ukuran</label>
          <input type="text" id="keterangan" placeholder="Contoh: 50ml, 100ml, Sachet" required>
        </div>
        <div class="form-group">
          <label for="jumlah">Jumlah</label>
          <input type="number" id="jumlah" placeholder="0" min="1" required>
        </div>
        <button type="submit" class="btn-primary">+ Tambah</button>
      </form>
    </div>

    <!-- TABEL HASIL -->
    <div class="card">
      <div class="table-actions">
        <h3>Daftar Barang Terinput (<span id="totalItems">0</span>)</h3>
        <div style="display: flex; gap: 8px;">
          <button id="btnExport" class="btn-secondary">Download Excel (CSV)</button>
          <button id="btnClear" class="btn-outline-danger">Reset Semua</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th style="width: 50px;" class="text-center">No</th>
              <th style="width: 130px;">Tanggal</th>
              <th>Nama Barang</th>
              <th>Keterangan / Varian</th>
              <th style="width: 100px;" class="text-center">Jumlah</th>
              <th style="width: 80px;" class="text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Diisi lewat JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('itemForm');
    const tanggalInput = document.getElementById('tanggal');
    const namaInput = document.getElementById('namaBarang');
    const ketInput = document.getElementById('keterangan');
    const jmlInput = document.getElementById('jumlah');
    const tableBody = document.getElementById('tableBody');
    const totalItemsSpan = document.getElementById('totalItems');
    const btnExport = document.getElementById('btnExport');
    const btnClear = document.getElementById('btnClear');

    // Set default input tanggal ke tanggal hari ini secara otomatis
    function setDefaultDate() {
      const today = new Date().toISOString().split('T')[0];
      tanggalInput.value = today;
    }

    // Ambil data dari localStorage jika sebelumnya sudah pernah tersimpan
    let items = JSON.parse(localStorage.getItem('toko_items')) || [];

    function saveData() {
      localStorage.setItem('toko_items', JSON.stringify(items));
    }

    function renderTable() {
      tableBody.innerHTML = '';
      totalItemsSpan.textContent = items.length;

      if (items.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center" style="padding: 24px; color: #94a3b8;">
              Belum ada data barang. Silakan isi form di atas!
            </td>
          </tr>
        `;
        return;
      }

      items.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="text-center">${index + 1}</td>
          <td><span class="date-badge">${item.tanggal || '-'}</span></td>
          <td><strong>${item.nama}</strong></td>
          <td><span class="badge">${item.keterangan}</span></td>
          <td class="text-center">${item.jumlah}</td>
          <td class="text-center">
            <button class="btn-delete" onclick="deleteItem(${index})">Hapus</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    // Tambah barang baru
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const newItem = {
        tanggal: tanggalInput.value,
        nama: namaInput.value.trim(),
        keterangan: ketInput.value.trim(),
        jumlah: parseInt(jmlInput.value)
      };

      items.push(newItem);
      saveData();
      renderTable();

      // Kosongkan nama, keterangan, dan jumlah (tanggal tetap dipertahankan tanggal terpilih)
      namaInput.value = '';
      ketInput.value = '';
      jmlInput.value = '';
      namaInput.focus();
    });

    // Hapus satu baris
    window.deleteItem = function(index) {
      if (confirm('Yakin ingin menghapus barang ini?')) {
        items.splice(index, 1);
        saveData();
        renderTable();
      }
    };

    // Bersihkan seluruh data tabel
    btnClear.addEventListener('click', () => {
      if (items.length === 0) return;
      if (confirm('Apakah kamu yakin ingin mengosongkan seluruh daftar barang?')) {
        items = [];
        saveData();
        renderTable();
      }
    });

    // Download ke format file CSV yang bisa dibuka di Microsoft Excel
    btnExport.addEventListener('click', () => {
      if (items.length === 0) {
        alert('Tabel masih kosong, tidak ada data untuk diexport.');
        return;
      }

      let csvContent = 'No,Tanggal,Nama Barang,Keterangan,Jumlah\n';
      items.forEach((item, i) => {
        csvContent += `${i + 1},"${item.tanggal || ''}","${item.nama}","${item.keterangan}",${item.jumlah}\n`;
      });

      // Ditambahkan BOM (\uFEFF) agar karakter khusus/tanda baca terbaca rapi saat dibuka di Microsoft Excel
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `daftar_barang_toko_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    // Inisialisasi awal saat halaman dibuka
    setDefaultDate();
    renderTable();
  </script>
</body>
</html>
